# Demo pipeline that consumes the account-level Application Advisor step group template
# (demo/harness/templates/application-advisor.yaml). Project: default_project.
pipeline:
  name: Upgrade
  identifier: Upgrade
  projectIdentifier: default_project
  orgIdentifier: default
  description: Apply the next Application Advisor upgrade-plan step to the demo branch and open a PR
  tags:
    demo: application-advisor
  properties:
    ci:
      codebase:
        connectorRef: harness_advisor_demo
        build:
          type: branch
          spec:
            branch: demo
  stages:
    - stage:
        name: Application Advisor Upgrade
        identifier: advisor_upgrade
        type: CI
        spec:
          cloneCodebase: true
          # Local Docker runner on a Linux AMD64 host (the delegate is tagged linux-amd64).
          # The advisor CLI is published for Linux AMD64 only, so it runs natively here.
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Docker
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: Application Advisor
                  identifier: application_advisor
                  template:
                    templateRef: account.application_advisor
                    versionLabel: v6
                    templateInputs:
                      steps:
                        - step:
                            identifier: run_advisor
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: maven:3.9-eclipse-temurin-17
                              envVariables:
                                ADVISOR_OPERATION: upgrade
                                ADVISOR_VERSION: 1.7.1
                                MAVEN_MIRROR_URL: http://192.168.5.40:8082/artifactory/spring-enterprise-remote
                                MAVEN_MIRROR_USERNAME: admin
                                MAVEN_MIRROR_PASSWORD: <+secrets.getValue("ARTIFACTORY_PASSWORD")>
                                # The runner gives steps the host's Docker socket, so Testcontainers would try the
                                # MySQL/Postgres integration tests; this demo skips them (no compose file, slow).
                                VERIFY_COMMAND: ./mvnw -B test -Dtest='!MySqlIntegrationTests,!PostgresIntegrationTests' -Dsurefire.failIfNoSpecifiedTests=false
                        - step:
                            identifier: open_pull_request
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: maven:3.9-eclipse-temurin-17
                              envVariables:
                                GH_TOKEN: <+secrets.getValue("GH_TOKEN")>
