# Harness CI step group template: Application Advisor patch/upgrade + GitHub PR.
#
# Add it to the CI stage of an existing pipeline (Add Step -> Use template). The stage
# must clone a GitHub codebase and run Maven builds. Scope: account. This file is the
# source of truth; publish a change as a new version label (Templates -> application_advisor
# -> New Version, paste the YAML) and move pipelines to it when ready.
#
# Inputs (set when adding the template to a stage):
#   - image: a JDK 17+ image with git and curl. The advisor CLI exists for Linux AMD64 only,
#     so the step container must be AMD64. On Apple Silicon local runners, pin the AMD64
#     digest of a multi-arch image so Docker runs it under emulation.
#   - ADVISOR_OPERATION: patch or upgrade.
#   - MAVEN_MIRROR_URL / _USERNAME / _PASSWORD: a repository manager remote that proxies
#     Broadcom's Spring Enterprise repository. No Broadcom credentials are needed in CI.
#   - VERIFY_COMMAND: runs after the advisor changes the build; empty to skip.
#   - GH_TOKEN: a GitHub token that can push a branch and open a pull request.
# Outputs: run_advisor -> CHANGED, OPERATION; open_pull_request -> PR_URL.
template:
  name: Application Advisor
  identifier: application_advisor
  versionLabel: v6
  type: StepGroup
  description: Apply Spring Application Advisor patches or the next upgrade step to a Maven project and open a GitHub pull request.
  tags:
    spring: ""
    application-advisor: ""
  spec:
    stageType: CI
    steps:
      - step:
          type: Run
          name: Run Application Advisor
          identifier: run_advisor
          timeout: 45m
          spec:
            connectorRef: <+input>
            image: <+input>
            shell: Bash
            envVariables:
              ADVISOR_OPERATION: <+input>.allowedValues(patch,upgrade)
              ADVISOR_VERSION: <+input>.default(1.7.1)
              MAVEN_MIRROR_URL: <+input>
              MAVEN_MIRROR_USERNAME: <+input>
              MAVEN_MIRROR_PASSWORD: <+input>
              VERIFY_COMMAND: <+input>.default(./mvnw -B test)
            outputVariables:
              - name: CHANGED
              - name: OPERATION
            command: |-
              set -euo pipefail
              CHANGED=false
              OPERATION="${ADVISOR_OPERATION}"

              if [[ "$(uname -m)" != x86_64 ]]; then
                echo "The advisor CLI is published for Linux AMD64 only; this container is $(uname -m)." >&2
                echo "Use an AMD64 image (on Apple Silicon, pin the image's linux/amd64 digest)." >&2
                exit 1
              fi

              # The runner creates the workspace as the host user; the step container may run as
              # another user (root), which git refuses without a safe.directory entry.
              git config --global --add safe.directory "$PWD"

              # Maven: resolve Spring Enterprise artifacts through the repository manager.
              settings="$HOME/.m2/settings.xml"
              if [[ -e "$settings" ]]; then
                echo "$settings already exists in this image; refusing to overwrite it." >&2
                exit 1
              fi
              mkdir -p "$HOME/.m2"
              (umask 077; cat > "$settings" <<EOF
              <settings>
                <servers>
                  <server>
                    <id>spring-enterprise-mirror</id>
                    <username>${MAVEN_MIRROR_USERNAME}</username>
                    <password>${MAVEN_MIRROR_PASSWORD}</password>
                  </server>
                </servers>
                <mirrors>
                  <mirror>
                    <id>spring-enterprise-mirror</id>
                    <mirrorOf>spring-enterprise-subscription</mirrorOf>
                    <url>${MAVEN_MIRROR_URL}</url>
                  </mirror>
                </mirrors>
              </settings>
              EOF
              )

              # Advisor CLI, downloaded through the same remote and kept outside the workspace.
              cli_dir=/tmp/advisor-cli
              mkdir -p "$cli_dir"
              curl -fsSL -u "${MAVEN_MIRROR_USERNAME}:${MAVEN_MIRROR_PASSWORD}" -o /tmp/advisor-cli.tar \
                "${MAVEN_MIRROR_URL%/}/com/vmware/tanzu/spring/application-advisor-cli-linux/${ADVISOR_VERSION}/application-advisor-cli-linux-${ADVISOR_VERSION}.tar"
              tar -xf /tmp/advisor-cli.tar -C "$cli_dir" --strip-components=1 --exclude=./META-INF
              export PATH="$cli_dir:$PATH"
              advisor --version

              # The pull request title and description are written under .git/ (shared with the
              # next step, never committed). clean() strips colours and progress redraws.
              out=.git/advisor-output.log
              body=.git/advisor-pr-body.md
              title=.git/advisor-pr-title
              clean() { sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' -e 's/\r/\n/g' | tr -d '\000-\010\013\014\016-\037'; }

              advisor build-config get
              case "$ADVISOR_OPERATION" in
                patch)
                  advisor patch apply 2>&1 | tee "$out"
                  # Extract the "group:artifact:version -> version" changes. The advisor prints an
                  # arrow (U+2192); Harness strips non-ASCII characters from step scripts, so the
                  # script builds it from its UTF-8 bytes.
                  arrow=$'\xe2\x86\x92'
                  changes="$(clean < "$out" | grep -o -E "[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[^[:space:]]+ ${arrow} [^[:space:]]+" | sort -u || true)"
                  count="$(printf '%s' "$changes" | grep -c "$arrow" || true)"
                  echo "Application Advisor: patch ${count} dependencies" > "$title"
                  {
                    echo "Application Advisor applied the latest patch release of each dependency within its current release line."
                    echo
                    echo "<details><summary>Dependency changes (${count})</summary>"
                    echo
                    echo '```'
                    printf '%s\n' "$changes"
                    echo '```'
                    echo
                    echo "</details>"
                  } > "$body"
                  ;;
                upgrade)
                  # Exit 50 means some upgrades are blocked. Both commands return it even when
                  # the plan has steps and apply succeeds; the CHANGED check below decides.
                  advisor upgrade-plan get 2>&1 | tee "$out" || [[ $? -eq 50 ]]
                  plan="$(clean < "$out" | sed -n '/Projects discovered/,$p')"
                  step1="$(printf '%s\n' "$plan" | sed -n '/- Step 1:/,/- Step 2:/p' | grep -m1 -o 'spring-boot from [^ ]* to [^ ]*' || true)"
                  echo "Application Advisor: upgrade ${step1:-dependencies}" > "$title"
                  {
                    echo "Application Advisor applied **Step 1** of the upgrade plan below. Merge it, then run the upgrade again to apply the next step; the plan is recomputed each time."
                    echo
                    echo "### Upgrade plan (computed before this change)"
                    echo
                    echo '```'
                    printf '%s\n' "${plan:-The advisor output did not include a plan section.}"
                    echo '```'
                  } > "$body"
                  advisor upgrade-plan apply || [[ $? -eq 50 ]]
                  ;;
                *)
                  echo "ADVISOR_OPERATION must be patch or upgrade." >&2
                  exit 2
                  ;;
              esac

              # Never commit working files: the advisor writes .advisor/ and target/, and the Harness
              # clone step writes plugin-build-tool.json. Exclude them in this clone only (pathspec
              # excludes make `git add` fail when the repo already ignores them).
              mkdir -p .git/info && printf '.advisor/\ntarget/\nplugin-build-tool.json\n' >> .git/info/exclude
              # A separate assignment, so a failing git status stops the step under set -e.
              status="$(git status --porcelain)"
              if [[ -z "$status" ]]; then
                echo "Application Advisor made no changes."
                exit 0
              fi
              CHANGED=true
              git status --short

              if [[ -n "${VERIFY_COMMAND:-}" ]]; then
                bash -c "$VERIFY_COMMAND"
                printf '\nVerification: `%s` passed in the pipeline.\n' "$VERIFY_COMMAND" >> "$body"
              fi
      - step:
          type: Run
          name: Open pull request
          identifier: open_pull_request
          timeout: 10m
          when:
            stageStatus: Success
            condition: <+stepGroup.steps.run_advisor.output.outputVariables.CHANGED> == "true"
          spec:
            connectorRef: <+input>
            image: <+input>
            shell: Bash
            envVariables:
              GH_TOKEN: <+input>
              ADVISOR_OPERATION: <+stepGroup.steps.run_advisor.output.outputVariables.OPERATION>
              BASE_BRANCH: <+codebase.branch>
            outputVariables:
              - name: PR_URL
            command: |-
              set -euo pipefail
              PR_URL=""
              : "${GH_TOKEN:?Set GH_TOKEN to a GitHub token that can push and open pull requests}"
              : "${BASE_BRANCH:?The pipeline must build a branch of a GitHub codebase}"
              git config --global --add safe.directory "$PWD"

              repo="$(git remote get-url origin | sed -E 's#^(https://|git@)github\.com[:/]##; s#\.git$##')"
              if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
                echo "The codebase remote is not a github.com repository." >&2
                exit 1
              fi

              branch="advisor-${ADVISOR_OPERATION}-$(date -u +%Y%m%d-%H%M%S)"
              git config user.name "Application Advisor"
              git config user.email "application-advisor@users.noreply.github.com"
              git switch -c "$branch"
              mkdir -p .git/info
              grep -qxF 'plugin-build-tool.json' .git/info/exclude 2>/dev/null \
                || printf '.advisor/\ntarget/\nplugin-build-tool.json\n' >> .git/info/exclude
              git add -A
              pr_title="$(cat .git/advisor-pr-title 2>/dev/null || echo "Application Advisor: ${ADVISOR_OPERATION}")"
              git commit -q -m "$pr_title"
              auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
              git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
                push -q "https://github.com/${repo}.git" "HEAD:refs/heads/${branch}"

              {
                cat .git/advisor-pr-body.md 2>/dev/null || echo "Generated by Application Advisor."
                echo
                echo "---"
                echo "Opened by the Application Advisor step group in Harness pipeline **<+pipeline.name>** ([execution #<+pipeline.sequenceId>](<+pipeline.executionUrl>))."
              } > .git/advisor-pr-body.final
              # JSON-escape without jq: backslashes, quotes, tabs, then join lines with \n.
              json_escape() { sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\t/\\t/g' | awk '{ printf "%s%s", (NR > 1 ? "\\n" : ""), $0 }'; }
              payload="$(printf '{"title":"%s","head":"%s","base":"%s","body":"%s"}' \
                "$(printf '%s' "$pr_title" | json_escape)" "$branch" "$BASE_BRANCH" "$(json_escape < .git/advisor-pr-body.final)")"
              response="$(curl -fsS -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${repo}/pulls" \
                --data-binary @- <<< "$payload")"
              PR_URL="$(printf '%s' "$response" | grep -m1 -o '"html_url": *"[^"]*/pull/[0-9]*"' | sed -E 's/.*"(https[^"]*)"/\1/')"
              echo "Opened pull request: ${PR_URL}"
